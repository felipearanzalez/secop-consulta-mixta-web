services:
  - type: web
    name: secop-consulta-mixta-web
    runtime: static
    buildCommand: mkdir -p dist && cp index.html app.js styles.css dist/
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
